<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260">
    <!-- Orbit -->
    <ellipse
        cx="450"
        cy="120"
        rx="360"
        ry="82"
        fill="none"
        stroke="#4495B6"
        stroke-width="5"
        transform="rotate(-9 450 120)" />

    <!-- Destination Planet -->
    <circle
        cx="805"
        cy="82"
        r="12"
        fill="#F46B45" />

    <!-- North Star -->
    <g transform="translate(112 58)">
        <polygon
            points="0,-14 3.5,-3.5 14,0 3.5,3.5 0,14 -3.5,3.5 -14,0 -3.5,-3.5"
            fill="#E2B84D" />
    </g>

    <!-- Wordmark (Crisp White for Dark Theme & Console Header) -->
    <g transform="skewX(-14)">
        <text
            x="180"
            y="142"
            font-family="Space Grotesk, sans-serif"
            font-size="84"
            font-weight="800"
            fill="#FFFFFF"
            letter-spacing="-2">
            LANZAR
        </text>
    </g>

    <!-- AI Badge Accent -->
    <g transform="translate(560, 78)">
        <rect width="68" height="34" rx="17" fill="#F46B45" />
        <text x="34" y="24" text-anchor="middle" font-family="Space Grotesk, sans-serif" font-size="19" font-weight="800" fill="#FFFFFF" letter-spacing="1">AI</text>
    </g>

    <!-- Accent Line -->
    <line
        x1="185"
        y1="164"
        x2="710"
        y2="164"
        stroke="#4495B6"
        stroke-width="3"
        opacity="0.95" />

    <!-- Tagline Subtext (Atomic Gold for maximum legibility on dark surfaces) -->
    <text
        x="448"
        y="198"
        text-anchor="middle"
        font-family="Space Grotesk, sans-serif"
        font-size="21"
        font-weight="700"
        letter-spacing="2.2"
        fill="#E2B84D">
        Penny • Pete • Mina • Multi-Mind AI
    </text>
</svg>
